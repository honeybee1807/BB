name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Each test step posts the tail of its output as an annotation, so results show on the run page.
env:
  NOTE: >-
    sed 's/%/%25/g' | awk -v t="$TITLE" 'BEGIN{printf "::notice title=%s::", t} {printf "%s%%0A", $0} END{print ""}'
  # Every failed attempt's error lines, since GitHub keeps only the first few failure annotations.
  DETAILS: >-
    grep -aE '^ +[0-9]+\) \[|^ +(Retry #|Error|Expected|Received)|^ +[-+] ' "$RUNNER_TEMP/out.log" | head -n 200
    | TITLE="Failure details" eval "$NOTE"
  # Notes the CSP check leaves on pages that were still loading after five seconds.
  LOADING: >-
    jq -r '.. | objects | select(.type? == "still loading") | .description' "$RUNNER_TEMP/results.json"
    | sort -u | head -n 40 | TITLE="Still loading after five seconds" eval "$NOTE"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and unit tests
        env:
          TITLE: Typecheck, lint and unit tests
        run: |
          set +e
          npm run check 2>&1 | tee "$RUNNER_TEMP/out.log"; status=${PIPESTATUS[0]}
          tail -n 12 "$RUNNER_TEMP/out.log" | eval "$NOTE"
          exit $status

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only the services the tests use.
      - name: Start the local stack
        run: npx supabase start -x studio,mailpit,imgproxy,logflare,vector,realtime,edge-runtime,postgres-meta,supavisor
      - name: Database tests
        env:
          TITLE: Database tests
        run: |
          set +e
          npm run db:test 2>&1 | tee "$RUNNER_TEMP/out.log"; status=${PIPESTATUS[0]}
          { grep -E 'not ok|Failed|Wstat' "$RUNNER_TEMP/out.log"; tail -n 6 "$RUNNER_TEMP/out.log"; } | eval "$NOTE"
          exit $status
      - name: API tests
        if: success() || failure()
        env:
          TITLE: API tests
        run: |
          set +e
          npm run test:api 2>&1 | tee "$RUNNER_TEMP/out.log"; status=${PIPESTATUS[0]}
          { grep -E 'FAIL|×' "$RUNNER_TEMP/out.log" | head -n 20; tail -n 8 "$RUNNER_TEMP/out.log"; } | eval "$NOTE"
          exit $status

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Lighthouse is report-only.
    continue-on-error: ${{ matrix.suite == 'lighthouse' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [chromium, browsers, production, lighthouse]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the local stack
        run: npx supabase start -x studio,mailpit,imgproxy,logflare,vector,realtime,edge-runtime,postgres-meta,supavisor

      # Throwaway settings for this runner only: local stack keys, Cloudflare's always-pass Turnstile test keys and a fresh hash secret.
      - name: Write the app settings
        run: |
          set -euo pipefail
          npx supabase status -o env > "$RUNNER_TEMP/stack.env"
          set -a; . "$RUNNER_TEMP/stack.env"; set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          umask 077
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          IP_HASH_SECRET=$(openssl rand -hex 32)
          EOF
          rm "$RUNNER_TEMP/stack.env"

      - name: Install Chromium
        if: matrix.suite == 'chromium' || matrix.suite == 'production'
        run: npx playwright install --with-deps chromium
      - name: Install Firefox and WebKit
        if: matrix.suite == 'browsers'
        run: npx playwright install --with-deps firefox webkit

      # A failed test is run once more, so a flaky result shows both attempts.
      - name: Run the main suite
        if: matrix.suite == 'chromium'
        env:
          TITLE: Main suite, desktop and mobile Chromium
        run: |
          set +e
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/results.json"
          npx playwright test --retries 1 --reporter list,github,json 2>&1 | tee "$RUNNER_TEMP/out.log"; status=${PIPESTATUS[0]}
          sed -n '/^  [0-9]* \(passed\|failed\|flaky\|skipped\|interrupted\|did not run\)/,$p' "$RUNNER_TEMP/out.log" | head -n 60 | eval "$NOTE"
          eval "$DETAILS"
          eval "$LOADING"
          exit $status
      - name: Run Firefox and WebKit
        if: matrix.suite == 'browsers'
        env:
          TITLE: Firefox and WebKit
          # Browser output, so a page crash leaves its reason in the log.
          DEBUG: pw:browser
        run: |
          set +e
          npx playwright test --config playwright.browsers.config.ts --retries 1 --reporter list,github > "$RUNNER_TEMP/out.log" 2>&1; status=$?
          grep -v 'pw:browser' "$RUNNER_TEMP/out.log"
          sed -n '/^  [0-9]* \(passed\|failed\|flaky\|skipped\|interrupted\|did not run\)/,$p' "$RUNNER_TEMP/out.log" | head -n 60 | eval "$NOTE"
          grep -aiE 'MOZ_CRASH|ABORT|crash|SIGSEGV|SIGKILL|out of memory|oom' "$RUNNER_TEMP/out.log" | grep -v 'Page crashed' \
            | sed -E 's/^.*pw:browser[^ ]* //' | sort | uniq -c | sort -rn | head -n 20 | TITLE="Browser crash output" eval "$NOTE"
          eval "$DETAILS"
          # Whether the kernel killed anything for lack of memory during the run.
          oom="$(sudo dmesg -T | grep -iE 'out of memory|killed process|oom' || true)"
          { free -m; echo "out-of-memory entries: $(printf '%s' "$oom" | grep -c . || true)"; printf '%s\n' "$oom" | tail -n 20; } \
            | TITLE="Runner memory" eval "$NOTE"
          exit $status

      - name: Build and start the production server
        id: build
        if: matrix.suite == 'production' || matrix.suite == 'lighthouse'
        env:
          TITLE: Production build
        run: |
          set +e
          npm run build 2>&1 | tee "$RUNNER_TEMP/out.log"; status=${PIPESTATUS[0]}
          sed -n '/^Route (app)/,$p' "$RUNNER_TEMP/out.log" | grep -vE '/api/|/admin' | head -n 80 | eval "$NOTE"
          if [ "$status" -ne 0 ]; then tail -n 30 "$RUNNER_TEMP/out.log"; exit $status; fi
          nohup npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          curl -sf -o /dev/null --retry 30 --retry-connrefused --retry-delay 2 http://localhost:3000/admin/login
      - name: Check status codes and headers with curl -I
        if: matrix.suite == 'production'
        env:
          TITLE: Production status codes and CSP
        run: |
          set -uo pipefail
          bad=0
          report=""
          probe() {
            local want=$1 path=$2 headers code csp
            headers="$(curl -sSI "http://localhost:3000$path" | tr -d '\r')"
            code="$(echo "$headers" | head -n 1 | awk '{print $2}')"
            csp="$(echo "$headers" | grep -i '^content-security-policy:' || true)"
            line="$code $path"
            if [ "$code" != "$want" ]; then line="$line (wanted $want)"; bad=1; fi
            if [ -z "$csp" ]; then line="$line, no CSP"; bad=1; fi
            if echo "$csp" | grep -q "unsafe-eval"; then line="$line, CSP allows unsafe-eval"; bad=1; fi
            report="$report$line"$'\n'
          }
          for path in / /properties /properties/breakers-sea-view-apartment /regions/umhlanga \
            /regions/umhlanga/breakers-resort /about /contact /privacy /journal \
            /journal/placeholder-planning-a-halal-friendly-beach-holiday /admin/login; do
            probe 200 "$path"
          done
          for path in /properties/ci-missing-home /regions/ci-missing /regions/umhlanga/ci-missing \
            /journal/ci-missing-post /ci-missing-page; do
            probe 404 "$path"
          done
          # Drafts exist in the database but must answer 404 like missing pages.
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -q -v ON_ERROR_STOP=1 -c "
            insert into public.properties (estate_id, slug, name, is_published)
              select id, 'ci-draft-home', 'CI Draft Home', false from public.estates limit 1;
            insert into public.blog_posts (slug, title, body_md, is_published)
              values ('ci-draft-post', 'CI Draft Post', 'Draft.', false);" || { report="${report}could not add the drafts"$'\n'; bad=1; }
          probe 404 /properties/ci-draft-home
          probe 404 /journal/ci-draft-post
          curl -sSI http://localhost:3000/ | tr -d '\r' \
            | grep -iE '^(content-security-policy|strict-transport-security|x-content-type-options|referrer-policy|permissions-policy|x-frame-options):'
          # Whether the property page's first HTML carries the content or only the loading text, and how fast it starts.
          home=/properties/breakers-sea-view-apartment
          html="$(curl -s "http://localhost:3000$home")"
          if echo "$html" | grep -q "Loading the home"; then report="${report}$home: loading text in the HTML"$'\n'; fi
          if echo "$html" | grep -q "Breakers Sea View Apartment</h1>"; then report="${report}$home: heading in the HTML"$'\n'; fi
          # /about has no route check, so the gap between the two is roughly what the check costs.
          for path in $home /about; do
            ttfb="$(for i in 1 2 3 4 5; do curl -s -o /dev/null -w '%{time_starttransfer}s ' "http://localhost:3000$path"; done)"
            report="${report}$path: first byte $ttfb"$'\n'
          done
          printf '%s' "$report"
          printf '%s' "$report" | eval "$NOTE"
          exit $bad
      # CI is cleared so Playwright uses the production server instead of starting the dev server.
      - name: Run the publish and CSP checks against the production build
        if: matrix.suite == 'production' && steps.build.outcome == 'success' && (success() || failure())
        env:
          CI: ""
          TITLE: Publish and CSP checks on the production build
        run: |
          set +e
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/results.json"
          npx playwright test e2e/publish-status.spec.ts e2e/csp.spec.ts --project desktop-chromium --retries 1 --reporter list,github,json 2>&1 | tee "$RUNNER_TEMP/out.log"; status=${PIPESTATUS[0]}
          sed -n '/^  [0-9]* \(passed\|failed\|flaky\|skipped\|interrupted\|did not run\)/,$p' "$RUNNER_TEMP/out.log" | head -n 60 | eval "$NOTE"
          eval "$DETAILS"
          eval "$LOADING"
          exit $status

      # Three runs per page and form factor; the run with the median performance score is reported.
      - name: Lighthouse
        if: matrix.suite == 'lighthouse' && steps.build.outcome == 'success'
        env:
          TITLE: Lighthouse, median of three
        run: |
          set +e
          dir="$RUNNER_TEMP/lighthouse"
          mkdir -p "$dir"
          report="lighthouse $(npx --yes lighthouse --version)"$'\n'
          for page in / /properties/breakers-sea-view-apartment; do
            for form in mobile desktop; do
              preset=""
              if [ "$form" = desktop ]; then preset="--preset=desktop"; fi
              rm -f "$dir"/run-*.json
              for i in 1 2 3; do
                npx --yes lighthouse "http://localhost:3000$page" $preset --quiet \
                  --chrome-flags="--headless=new --no-sandbox" \
                  --only-categories=performance,accessibility,best-practices,seo \
                  --output=json --output-path="$dir/run-$i.json"
              done
              scores="$(for f in "$dir"/run-*.json; do jq '(.categories.performance.score // 0) * 100 | round' "$f"; done | tr '\n' ' ')"
              median="$(for f in "$dir"/run-*.json; do echo "$(jq '.categories.performance.score // 0' "$f") $f"; done | sort -n | sed -n 2p | cut -d' ' -f2)"
              line="$(jq -r '[
                "perf \((.categories.performance.score // 0) * 100 | round)",
                "a11y \((.categories.accessibility.score // 0) * 100 | round)",
                "best \((.categories["best-practices"].score // 0) * 100 | round)",
                "seo \((.categories.seo.score // 0) * 100 | round)",
                "FCP \(.audits["first-contentful-paint"].displayValue)",
                "LCP \(.audits["largest-contentful-paint"].displayValue)",
                "TBT \(.audits["total-blocking-time"].displayValue)",
                "CLS \(.audits["cumulative-layout-shift"].displayValue)"
              ] | join(", ")' "$median")"
              diag="$(jq -r '
                def snips: [.. | objects | select(has("snippet")) | .snippet[0:160]] | unique | .[0:3] | join(" | ");
                def from(p): [.audits | to_entries[] | select(.key | test(p)) | .value | snips | select(. != "")] | first // "none";
                [
                  "TTFB \(.audits["server-response-time"].displayValue // "?")",
                  "LCP element: \(from("largest-contentful-paint-element|lcp"))",
                  "shifts: \(from("layout-shift|cls"))",
                  "below 0.9: \([.audits | to_entries[] | select(.value.score != null and .value.score < 0.9
                    and .value.scoreDisplayMode != "informative" and .value.scoreDisplayMode != "manual") | .key] | join(", "))"
                ] | join("; ")' "$median")"
              report="$report$form $page: $line (perf runs: $scores)"$'\n'"  $diag"$'\n'
            done
          done
          printf '%s' "$report"
          printf '%s' "$report" | eval "$NOTE"
          exit 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
